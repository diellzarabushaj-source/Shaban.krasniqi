name: Sanity Studio Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'sanity-studio/**'
      - '.github/workflows/sanity-deploy.yml'

jobs:
  sanity-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanity-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Validate schema and build
        run: |
          npm run schema:extract
          npm run build

      - name: Deploy schema
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest schemas deploy --workspace default

      - name: Deploy hosted Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest deploy --yes --no-build --url shaban-krasniqi-blog.sanity.studio
