name: Sanity Studio Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'sanity-studio/**'
      - '.github/workflows/sanity-deploy.yml'

jobs:
  sanity-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanity-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and validate Studio
        run: npm run build
      - name: Deploy Studio and schema
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest deploy --yes --schema-required

# Deployment workflow intentionally kept separate from frontend CI.
