name: Tooling and site smoke

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-tooling.mjs
      - run: node scripts/check-site.mjs
      - run: bash -n scripts/bootstrap-agent-tools.sh
      - shell: pwsh
        run: ./scripts/bootstrap-agent-tools.ps1 -DryRun

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
