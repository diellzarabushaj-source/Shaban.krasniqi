name: Tooling smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-tooling.mjs
      - run: bash -n scripts/bootstrap-agent-tools.sh
      - shell: pwsh
        run: ./scripts/bootstrap-agent-tools.ps1 -DryRun
