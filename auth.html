<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hyrje · Fizioterapia Shaban Krasniqi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#10243a;font-family:Manrope,Arial,sans-serif}.shell{width:min(460px,calc(100% - 32px))}.brand{font:800 22px Montserrat,Arial;text-align:center;margin-bottom:20px}.card{background:#fff;border:1px solid #e2e7ec;border-radius:20px;padding:20px;box-shadow:0 18px 50px rgba(0,27,54,.1)}.back{display:block;text-align:center;margin-top:16px;color:#607080;text-decoration:none}.error{color:#a33}</style></head><body><main class="shell"><div class="brand">Fizioterapia Shaban Krasniqi</div><div class="card"><div id="clerk-auth-form"></div></div><a class="back" href="/">← Faqja kryesore</a></main><script>async function start(){const r=await fetch('/api/clerk-config',{cache:'no-store'}),cfg=await r.json();if(!r.ok||!cfg.publishableKey)throw Error(cfg.error||'Clerk nuk është konfiguruar');const key=cfg.publishableKey;const load=s=>new Promise((ok,no)=>{const x=document.createElement('script');x.src=s;x.async=true;x.crossOrigin='anonymous';x.onload=ok;x.onerror=()=>no(new Error('ClerkJS nuk u ngarkua nga CDN'));document.head.append(x)});await load('https://cdn.jsdelivr.net/npm/@clerk/ui@1/dist/ui.browser.js');await load('https://cdn.jsdelivr.net/npm/@clerk/clerk-js@6/dist/clerk.browser.js');if(!window.Clerk)throw Error('ClerkJS nuk u inicializua');const clerk=new window.Clerk(key);await clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});if(clerk.isSignedIn){location.href='/dashboard.html';return}clerk.mountSignIn(document.getElementById('clerk-auth-form'),{fallbackRedirectUrl:'/dashboard.html'})}start().catch(e=>{document.getElementById('clerk-auth-form').innerHTML='<p class="error">'+(e.message||'Clerk nuk mund të ngarkohet.')+'</p>'});</script></body></html>
