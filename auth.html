<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hyrje · Fizioterapia Shaban Krasniqi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#10243a;font-family:Manrope,Arial,sans-serif}.shell{width:min(460px,calc(100% - 32px))}.brand{font:800 22px Montserrat,Arial;text-align:center;margin-bottom:20px}.card{background:#fff;border:1px solid #e2e7ec;border-radius:20px;padding:20px;box-shadow:0 18px 50px rgba(0,27,54,.1)}.back{display:block;text-align:center;margin-top:16px;color:#607080;text-decoration:none}.error{color:#a33;line-height:1.5}</style>
</head>
<body><main class="shell"><div class="brand">Fizioterapia Shaban Krasniqi</div><div class="card"><div id="clerk-auth-form"></div></div><a class="back" href="/">← Faqja kryesore</a></main>
<script>
async function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.crossOrigin='anonymous';s.onload=resolve;s.onerror=()=>reject(new Error('ClerkJS nuk u ngarkua nga Clerk Frontend API'));document.head.appendChild(s)})}
function getClerkDomain(key){
  const encoded=key.split('_')[2];
  if(!encoded) throw new Error('Publishable Key i Clerk është i pavlefshëm');
  const normalized=encoded.replace(/-/g,'+').replace(/_/g,'/');
  const padded=normalized+'='.repeat((4-normalized.length%4)%4);
  const decoded=atob(padded);
  const domain=decoded.endsWith('$')?decoded.slice(0,-1):decoded.slice(0,-1);
  if(!domain||!domain.includes('.')) throw new Error('Clerk Frontend API domain nuk u gjet');
  return domain;
}
async function start(){
  try{
    const r=await fetch('/api/clerk-config',{cache:'no-store'});const cfg=await r.json();
    if(!r.ok||!cfg.publishableKey)throw Error(cfg.error||'Clerk nuk është konfiguruar');
    const key=cfg.publishableKey;
    const domain=getClerkDomain(key);
    await loadScript('https://'+domain+'/npm/@clerk/ui@1/dist/ui.browser.js');
    await loadScript('https://'+domain+'/npm/@clerk/clerk-js@6/dist/clerk.browser.js');
    if(!window.Clerk)throw Error('ClerkJS nuk u inicializua');
    const clerk=new window.Clerk(key);
    await clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});
    if(clerk.isSignedIn){location.href='/dashboard.html';return}
    clerk.mountSignIn(document.getElementById('clerk-auth-form'),{fallbackRedirectUrl:'/dashboard.html'});
  }catch(e){document.getElementById('clerk-auth-form').innerHTML='<p class="error">'+(e.message||'Clerk nuk mund të ngarkohet.')+'</p>';console.error('[Clerk]',e)}
}
start();
</script></body></html>
