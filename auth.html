<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hyrje · Fizioterapia Shaban Krasniqi"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#10243a;font-family:Manrope,Arial,sans-serif}.shell{width:min(460px,calc(100% - 32px))}.brand{font:800 22px Montserrat,Arial;text-align:center;margin-bottom:20px}.card{background:#fff;border:1px solid #e2e7ec;border-radius:20px;padding:20px;box-shadow:0 18px 50px rgba(0,27,54,.1)}.back{display:block;text-align:center;margin-top:16px;color:#607080;text-decoration:none}</style></head><body><main class="shell"><div class="brand">Fizioterapia Shaban Krasniqi</div><div class="card"><div id="clerk-auth-form"></div></div><a class="back" href="/">← Faqja kryesore</a></main><script>async function start(){const r=await fetch('/api/clerk-config',{cache:'no-store'}),cfg=await r.json();if(!r.ok||!cfg.publishableKey)throw Error(cfg.error||'Clerk nuk është konfiguruar');const domain=atob(cfg.publishableKey.split('_')[2]).slice(0,-1);const load=s=>new Promise((ok,no)=>{const x=document.createElement('script');x.src=s;x.async=true;x.crossOrigin='anonymous';x.onload=ok;x.onerror=no;document.head.append(x)});await load('https://'+domain+'/npm/@clerk/ui@1/dist/ui.browser.js');await load('https://'+domain+'/npm/@clerk/clerk-js@6/dist/clerk.browser.js');await Clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});if(Clerk.isSignedIn){location.href='/dashboard.html';return}Clerk.mountSignIn(document.getElementById('clerk-auth-form'),{fallbackRedirectUrl:'/dashboard.html'})}start().catch(e=>document.getElementById('clerk-auth-form').textContent=e.message);</script></body></html>
